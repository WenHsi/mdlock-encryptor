<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>MdLock Icon Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a14;
  display: flex; flex-direction: column;
  align-items: center;
  min-height: 100vh; gap: 3rem; padding: 3rem;
  font-family: system-ui, sans-serif; color: #e2e2ec;
}
h1 { font-size: .7rem; letter-spacing: .24em; color: #2a2a3e; text-transform: uppercase; }
h2 { font-size: .6rem; letter-spacing: .16em; color: #2a2a3e; text-transform: uppercase; margin-bottom: 1.5rem; text-align: center; }
.row { display: flex; flex-wrap: wrap; gap: 3rem; justify-content: center; }
.variant { display: flex; flex-direction: column; align-items: center; gap: .9rem; }
.label { font-size: .58rem; color: #2a2a3e; letter-spacing: .1em; text-transform: uppercase; }

/* ── Base icon ── */
.icon {
  width: 180px; height: 180px;
  border-radius: 42px;
  box-shadow: 0 20px 60px rgba(0,0,0,.9), 0 4px 16px rgba(0,0,0,.6);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative; overflow: hidden; flex-shrink: 0;
  gap: 12px;
}

/* sparkles */
.spark { position: absolute; border-radius: 50%; pointer-events: none; }
.sp1 { width: 4px; height: 4px; top: 24px; right: 32px; }
.sp2 { width: 3px; height: 3px; top: 38px; right: 22px; opacity: .55; }
.sp3 { width: 2px; height: 2px; top: 50px; right: 38px; opacity: .35; }
.sp4 { width: 3px; height: 3px; top: 30px; left: 28px; opacity: .6; }
.sp5 { width: 2px; height: 2px; bottom: 34px; right: 26px; opacity: .3; }

/* lock */
.lock { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; }
.arc {
  width: 58px; height: 38px;
  border: 8px solid transparent;
  border-bottom: none; border-radius: 29px 29px 0 0;
  margin-bottom: -2px;
}
.body {
  width: 118px; height: 84px; border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 1;
}
.md {
  font-size: 35px; font-weight: 800;
  letter-spacing: .04em; line-height: 1;
  font-family: 'Plus Jakarta Sans', sans-serif;
  position: relative; z-index: 1;
  margin-top: -12px;
}
.keyhole {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; z-index: 2;
}
.kc {
  width: 9px; height: 9px; border-radius: 50%;
  background: rgba(0,0,0,.4);
  border: 1.5px solid rgba(212,168,48,.38);
  box-shadow: 0 0 5px rgba(212,168,48,.18);
}
.ks {
  width: 5px; height: 7px;
  background: rgba(0,0,0,.4);
  border: 1.5px solid rgba(212,168,48,.38);
  border-top: none; border-radius: 0 0 3px 3px;
  margin-top: -1px;
  box-shadow: 0 0 4px rgba(212,168,48,.15);
}
.app-name {
  font-size: 11px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase;
  font-family: 'Plus Jakarta Sans', sans-serif;
  position: relative; z-index: 1;
  padding: 3px 10px;
  border-radius: 20px;
}

/* ── Colour themes ── */

/* 1 — Navy Bright */
.c1 { background: linear-gradient(150deg, #111e3e 0%, #090f26 100%); }
.c1::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 40% 20%, rgba(100,150,255,.15) 0%, transparent 60%); }
.c1 .arc { border-top-color:rgba(100,150,255,.6); border-left-color:rgba(100,150,255,.6); border-right-color:rgba(100,150,255,.6); }
.c1 .body { background:linear-gradient(155deg,rgba(100,150,255,.12) 0%,rgba(60,90,200,.22) 100%); border:1.5px solid rgba(100,150,255,.5); box-shadow:0 0 20px rgba(100,150,255,.15), inset 0 1px 0 rgba(100,150,255,.35); }
.c1 .md { color:#d8e4ff; }
.c1 .app-name { color:rgba(160,190,255,.5); border:1px solid rgba(160,190,255,.2); background:rgba(100,140,255,.06); }
.c1 .spark { background:#d4a830; box-shadow:0 0 6px 2px rgba(212,168,48,.55),0 0 12px rgba(212,168,48,.2); }

/* 2 — Teal Deep */
.c2 { background: linear-gradient(150deg, #091e1e 0%, #041010 100%); }
.c2::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 40% 20%, rgba(40,180,160,.12) 0%, transparent 60%); }
.c2 .arc { border-top-color:rgba(40,200,180,.6); border-left-color:rgba(40,200,180,.6); border-right-color:rgba(40,200,180,.6); }
.c2 .body { background:linear-gradient(155deg,rgba(40,200,180,.12) 0%,rgba(20,140,120,.22) 100%); border:1.5px solid rgba(40,200,180,.5); box-shadow:0 0 20px rgba(40,200,180,.15), inset 0 1px 0 rgba(40,200,180,.35); }
.c2 .md { color:#c8f0e8; }
.c2 .app-name { color:rgba(120,220,200,.45); border:1px solid rgba(40,200,180,.18); background:rgba(40,180,160,.05); }
.c2 .spark { background:#d4a830; box-shadow:0 0 6px 2px rgba(212,168,48,.55),0 0 12px rgba(212,168,48,.2); }

/* 3 — Violet Dusk */
.c3 { background: linear-gradient(150deg, #181026 0%, #0e0818 100%); }
.c3::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 40% 20%, rgba(160,100,255,.13) 0%, transparent 60%); }
.c3 .arc { border-top-color:rgba(160,100,255,.6); border-left-color:rgba(160,100,255,.6); border-right-color:rgba(160,100,255,.6); }
.c3 .body { background:linear-gradient(155deg,rgba(160,100,255,.1) 0%,rgba(100,50,200,.2) 100%); border:1.5px solid rgba(160,100,255,.5); box-shadow:0 0 20px rgba(160,100,255,.15), inset 0 1px 0 rgba(160,100,255,.35); }
.c3 .md { color:#e8d8ff; }
.c3 .app-name { color:rgba(180,140,255,.45); border:1px solid rgba(160,100,255,.18); background:rgba(140,80,255,.05); }
.c3 .spark { background:#d4a830; box-shadow:0 0 6px 2px rgba(212,168,48,.55),0 0 12px rgba(212,168,48,.2); }

/* 4 — Slate Warm */
.c4 { background: linear-gradient(150deg, #17140f 0%, #0d0c0a 100%); }
.c4::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 40% 20%, rgba(200,150,80,.1) 0%, transparent 60%); }
.c4 .arc { border-top-color:rgba(200,150,80,.6); border-left-color:rgba(200,150,80,.6); border-right-color:rgba(200,150,80,.6); }
.c4 .body { background:linear-gradient(155deg,rgba(200,150,80,.12) 0%,rgba(150,100,40,.22) 100%); border:1.5px solid rgba(200,150,80,.5); box-shadow:0 0 20px rgba(200,150,80,.15), inset 0 1px 0 rgba(200,150,80,.35); }
.c4 .md { color:#e8ddd0; }
.c4 .app-name { color:rgba(200,180,140,.4); border:1px solid rgba(200,150,80,.16); background:rgba(180,130,60,.04); }
.c4 .spark { background:#d4a830; box-shadow:0 0 6px 2px rgba(212,168,48,.6),0 0 12px rgba(212,168,48,.25); }

/* ── UI ── */
hr { width:100%; border:none; border-top:1px solid #0e0e18; }
.btn-row { display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; }
button {
  background:#0e0e18; color:#30303e;
  border:1px solid #18182a; border-radius:8px;
  padding:.55rem 1rem; font-size:.7rem;
  cursor:pointer; transition:all .15s;
}
button:hover { background:#18182a; color:#e2e2ec; border-color:#28283a; }
button:disabled { opacity:.2; cursor:default; }
</style>
</head>
<body>

<h1>MdLock · Icon</h1>

<!-- macro to build icon HTML -->
<script>
function iconHTML(id, label) {
  return `
    <div class="icon ${id.split('-')[0]}" id="${id}">
      <div class="spark sp1"></div><div class="spark sp2"></div>
      <div class="spark sp3"></div><div class="spark sp4"></div><div class="spark sp5"></div>
      <div class="lock">
        <div class="arc"></div>
        <div class="body">
          <div class="md">MD</div>
          <div class="keyhole"><div class="kc"></div><div class="ks"></div></div>
        </div>
      </div>
      <div class="app-name">${label}</div>
    </div>`;
}
document.addEventListener('DOMContentLoaded', () => {
  const themes = [
    ['c1','Navy Bright','深藍亮版'],
    ['c2','Teal Deep','深青'],
    ['c3','Violet Dusk','紫暮'],
    ['c4','Slate Warm','暖灰'],
  ];
  const labels = [['enc','Encryptor'],['vie','Viewer']];
  const container = document.getElementById('grid');
  themes.forEach(([cls, name, nameTw]) => {
    const sec = document.createElement('section');
    sec.style.cssText = 'width:100%;max-width:900px';
    sec.innerHTML = `<h2>${name} · ${nameTw}</h2><div class="row" id="row-${cls}"></div>`;
    container.appendChild(sec);
    const row = sec.querySelector('.row');
    labels.forEach(([sfx, lbl]) => {
      const id = `${cls}-${sfx}`;
      const div = document.createElement('div');
      div.className = 'variant';
      div.innerHTML = iconHTML(id, lbl) +
        `<div class="label">${lbl}</div>` +
        `<button onclick="dl('${id}',180,'preview-${id}')">⬇ 180px</button>`;
      row.appendChild(div);
    });
    const hr = document.createElement('hr');
    container.appendChild(hr);
  });
});
</script>

<div id="grid" style="width:100%;max-width:900px;display:flex;flex-direction:column;gap:3rem;align-items:center"></div>

<div class="btn-row">
  <button onclick="dlAll('c1','enc','encryptor')">C1 Enc 全尺寸</button>
  <button onclick="dlAll('c1','vie','viewer')">C1 Vie 全尺寸</button>
  <button onclick="dlAll('c2','enc','encryptor')">C2 Enc 全尺寸</button>
  <button onclick="dlAll('c2','vie','viewer')">C2 Vie 全尺寸</button>
  <button onclick="dlAll('c3','enc','encryptor')">C3 Enc 全尺寸</button>
  <button onclick="dlAll('c3','vie','viewer')">C3 Vie 全尺寸</button>
  <button onclick="dlAll('c4','enc','encryptor')">C4 Enc 全尺寸</button>
  <button onclick="dlAll('c4','vie','viewer')">C4 Vie 全尺寸</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
async function dl(id, size, filename) {
  const btns = document.querySelectorAll('button');
  btns.forEach(b => b.disabled = true);
  const el = document.getElementById(id);
  const BASE = 180;
  const opts = { width: BASE, height: BASE, pixelRatio: (size / BASE) * 3, quality: 1 };
  await htmlToImage.toPng(el, opts);
  const dataUrl = await htmlToImage.toPng(el, opts);
  const img = new Image(); img.src = dataUrl;
  await new Promise(r => img.onload = r);
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  c.getContext('2d').drawImage(img, 0, 0, size, size);
  const a = document.createElement('a');
  a.download = filename + '.png'; a.href = c.toDataURL('image/png'); a.click();
  btns.forEach(b => b.disabled = false);
}
async function dlAll(cls, sfx, name) {
  const id = `${cls}-${sfx}`;
  const sizes = [[180,'apple-touch-icon-180'],[152,'apple-touch-icon-152'],[120,'apple-touch-icon-120'],[32,'favicon']];
  for (const [size, fname] of sizes) {
    await dl(id, size, fname);
    await new Promise(r => setTimeout(r, 350));
  }
}
</script>
</body>
</html>
