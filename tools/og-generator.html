<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>MdLock OG Thumbnail Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #080810;
  display: flex; flex-direction: column;
  align-items: center; gap: 3rem; padding: 3rem;
  font-family: system-ui, sans-serif; color: #e2e2ec;
  min-height: 100vh;
}
h1 { font-size: .65rem; letter-spacing: .22em; color: #22223a; text-transform: uppercase; }

/* ── OG card ── */
.og {
  width: 600px; height: 315px; /* display at 50% = 1200×630 */
  border-radius: 12px;
  background: linear-gradient(145deg, #16162a 0%, #0e0e1e 100%);
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  justify-content: center; padding: 0 56px;
  flex-shrink: 0;
}

/* accent glow top-right */
.og::after {
  content: ''; position: absolute;
  top: -60px; right: -60px;
  width: 260px; height: 260px;
  background: radial-gradient(circle, rgba(124,109,240,.22) 0%, transparent 70%);
  pointer-events: none;
}

/* grid lines */
.og-grid {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* left accent bar */
.og-bar {
  position: absolute; left: 0; top: 15%; bottom: 15%;
  width: 4px;
  background: linear-gradient(to bottom, transparent, #7c6df0, transparent);
}

/* lock mini icon */
.og-icon {
  display: flex; flex-direction: column;
  align-items: center; margin-bottom: 16px;
  position: relative; z-index: 1;
  align-self: flex-start;
}
.og-icon-line {
  width: 44px; height: 2px;
  background: linear-gradient(90deg, transparent 0%, rgba(212,168,48,.45) 50%, transparent 100%);
  border-radius: 50%;
  margin-top: 6px; margin-bottom: 0;
  position: relative; top: 5px;
  box-shadow: 0 0 6px rgba(212,168,48,.2);
}
.og-icon-arc {
  width: 22px; height: 15px;
  border: 3px solid #4a3e80;
  border-bottom: none;
  border-radius: 11px 11px 0 0;
  margin-bottom: -1px;
}
.og-icon-body {
  width: 36px; height: 28px;
  background: linear-gradient(155deg, rgba(124,109,240,.18) 0%, rgba(80,60,180,.1) 100%);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(124,109,240,.3);
  box-shadow: inset 0 1px 0 rgba(124,109,240,.2);
}
.og-icon-md {
  font-size: 10px; font-weight: 700; color: #a89cee;
  font-family: 'Inter', sans-serif; letter-spacing: .05em;
}

.og-tag {
  font-size: 10px; font-weight: 600;
  font-family: 'DM Mono', monospace;
  color: rgba(160,148,240,.75);
  letter-spacing: .16em; text-transform: uppercase;
  margin-bottom: 10px;
  position: relative; z-index: 1;
}

.og-title {
  font-size: 44px; font-weight: 700;
  font-family: 'Inter', sans-serif;
  color: #f0f0ff; line-height: 1.08;
  letter-spacing: -.025em;
  margin-bottom: 14px;
  position: relative; z-index: 1;
}
.og-title em { font-style: normal; color: #9d8ff0; }

.og-desc {
  font-size: 15px; font-weight: 400;
  font-family: 'Inter', sans-serif;
  color: #8888a8; line-height: 1.55;
  max-width: 400px;
  position: relative; z-index: 1;
}

.og-badge {
  position: absolute; bottom: 20px; right: 22px;
  font-size: 9.5px; font-weight: 500;
  font-family: 'DM Mono', monospace;
  color: rgba(180,180,220,.45);
  letter-spacing: .1em;
  z-index: 1;
}

/* dots deco */
.og-dots {
  position: absolute; right: 52px; top: 50%; transform: translateY(-50%);
  display: grid; grid-template-columns: repeat(5,1fr); gap: 9px;
  opacity: .18; z-index: 1;
}
.og-dot { width: 3px; height: 3px; border-radius: 50%; background: #7c6df0; }

/* ── UI ── */
.variant { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
.label { font-size: .6rem; color: #22223a; letter-spacing: .1em; text-transform: uppercase; }
.row { display: flex; flex-wrap: wrap; gap: 3rem; justify-content: center; }
button {
  background: #0e0e1a; color: #303048;
  border: 1px solid #18182e; border-radius: 8px;
  padding: .5rem 1.2rem; font-size: .7rem;
  cursor: pointer; transition: all .15s;
}
button:hover { background: #181830; color: #e2e2ec; border-color: #28284a; }
button:disabled { opacity: .2; cursor: default; }
</style>
</head>
<body>
<h1>MdLock · OG Thumbnail · 1200 × 630</h1>

<div class="row">
  <!-- Encryptor -->
  <div class="variant">
    <div class="og" id="og-enc">
      <div class="og-grid"></div>
      <div class="og-bar"></div>
      <div class="og-dots">
        <div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div>
        <div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div>
        <div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div>
        <div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div>
        <div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div>
      </div>
      <div class="og-icon">
        <div class="og-icon-arc"></div>
        <div class="og-icon-body"><div class="og-icon-md">MD</div></div>
        <div class="og-icon-line"></div>
      </div>
      <div class="og-title">Md<em>Lock</em> Encryptor</div>
      <div class="og-desc">AES-256-GCM 加密 Markdown，上傳 GitHub Gist，產生加密分享連結。純前端，無後端。</div>
      <div class="og-badge">wenhsi.github.io/mdlock-encryptor</div>
    </div>
    <div class="label">Encryptor</div>
    <button onclick="dlOg('og-enc','og-thumbnail')">⬇ 下載 1200×630</button>
  </div>

  <!-- Viewer -->
  <div class="variant">
    <div class="og" id="og-vie">
      <div class="og-grid"></div>
      <div class="og-bar"></div>
      <div class="og-dots">
        <div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div>
        <div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div>
        <div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div>
        <div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div>
        <div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div><div class="og-dot"></div>
      </div>
      <div class="og-icon">
        <div class="og-icon-arc"></div>
        <div class="og-icon-body"><div class="og-icon-md">MD</div></div>
        <div class="og-icon-line"></div>
      </div>
      <div class="og-title">Md<em>Lock</em> Viewer</div>
      <div class="og-desc">即時 Markdown 預覽 × AES-256-GCM 加密文件閱讀。純前端，無後端，無伺服器。</div>
      <div class="og-badge">wenhsi.github.io/mdlock-viewer</div>
    </div>
    <div class="label">Viewer</div>
    <button onclick="dlOg('og-vie','og-thumbnail')">⬇ 下載 1200×630</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
async function dlOg(id, filename) {
  const btns = document.querySelectorAll('button');
  btns.forEach(b => b.disabled = true);
  const el = document.getElementById(id);
  // render at 2× (600→1200px)
  const opts = { width: 600, height: 315, pixelRatio: 2, quality: 1 };
  await htmlToImage.toPng(el, opts); // warm font cache
  const dataUrl = await htmlToImage.toPng(el, opts);
  const img = new Image(); img.src = dataUrl;
  await new Promise(r => img.onload = r);
  const c = document.createElement('canvas');
  c.width = 1200; c.height = 630;
  c.getContext('2d').drawImage(img, 0, 0, 1200, 630);
  const a = document.createElement('a');
  a.download = filename + '.png'; a.href = c.toDataURL('image/png'); a.click();
  btns.forEach(b => b.disabled = false);
}
</script>
</body>
</html>
